name: Playwright UI Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Nightly full-matrix run at 02:00 UTC.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        # `dev`, `qa`, `staging` and `prod` are placeholder hosts in
        # src/config/environments.ts. Choosing one without also setting the
        # BASE_URL variable will fail against a domain that does not resolve.
        options: [demo, dev, qa, staging, prod]
        default: demo
      grep:
        description: Tag filter (e.g. @smoke)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `demo` (https://qaplayground.com) is the only environment this repository
  # has a real target for, so it is what every automatic run uses. The named
  # deployment environments are placeholders that do not resolve.
  TEST_ENV: ${{ github.event.inputs.environment || 'demo' }}
  CI: true
  HEADLESS: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Bounded so a registry stall fails in five minutes with a clear step
      # name, instead of sitting until the job timeout with no output.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
        timeout-minutes: 5
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: ${{ matrix.project }} (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Bounded so a registry stall fails in five minutes with a clear step
      # name, instead of sitting until the job timeout with no output.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
        timeout-minutes: 5

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # The binaries are cached; the system libraries are not, because each job
      # starts on a clean runner. Splitting the two means a cache hit skips the
      # ~150MB download and still gets the apt packages it needs.
      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.project }}

      - name: Install browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.project }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 ${{ github.event.inputs.grep && format('--grep {0}', github.event.inputs.grep) || '' }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  accessibility:
    name: Accessibility
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Bounded so a registry stall fails in five minutes with a clear step
      # name, instead of sitting until the job timeout with no output.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
        timeout-minutes: 5
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
        env:
          BASE_URL: ${{ vars.BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: reports/
          retention-days: 7

  visual:
    name: Visual regression
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Bounded so a registry stall fails in five minutes with a clear step
      # name, instead of sitting until the job timeout with no output.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
        timeout-minutes: 5
      - run: npx playwright install --with-deps chromium
      # Baselines are OS-specific; this job must match the container that
      # generated them, which is why visual runs are pinned to ubuntu-latest.
      - run: npm run test:visual
        env:
          BASE_URL: ${{ vars.BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  report:
    name: Merge reports
    if: always()
    needs: [test, accessibility, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Bounded so a registry stall fails in five minutes with a clear step
      # name, instead of sitting until the job timeout with no output.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
        timeout-minutes: 5

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
