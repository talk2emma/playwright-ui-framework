name: Playwright UI Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Nightly full-matrix run, at 02:37 UTC rather than 02:00.
    #
    # GitHub queues scheduled workflows on a shared pool and delays them under
    # load, and the top of the hour is the most contended slot there is —
    # everyone writes `0 2 * * *`. Measured on this repository, the 02:00 cron
    # actually fired at 07:10 and 07:06 on consecutive days, roughly five hours
    # late. An off-peak minute is free and makes "nightly" mean approximately
    # what it says.
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        # `dev`, `qa`, `staging` and `prod` are placeholder hosts in
        # src/config/environments.ts. Choosing one without also setting the
        # BASE_URL variable will fail against a domain that does not resolve.
        options: [demo, dev, qa, staging, prod]
        default: demo
      grep:
        description: Tag filter (e.g. @smoke)
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `demo` (https://qaplayground.com) is the only environment this repository
  # has a real target for, so it is what every automatic run uses. The named
  # deployment environments are placeholders that do not resolve.
  TEST_ENV: ${{ github.event.inputs.environment || 'demo' }}
  CI: true
  HEADLESS: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: ${{ matrix.project }} (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          # Chromium as well as the matrix browser: the `setup` project
          # declares no `use` block, so it runs on Playwright's default, and
          # every browser project depends on it. A firefox job with only
          # firefox installed fails before its first test, in `setup`.
          browsers: chromium ${{ matrix.project }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 ${{ github.event.inputs.grep && format('--grep {0}', github.event.inputs.grep) || '' }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  accessibility:
    name: Accessibility
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      - run: npm run test:a11y
        env:
          BASE_URL: ${{ vars.BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: reports/
          retention-days: 7

  visual:
    name: Visual regression
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: chromium
      # Baselines are per-platform (see snapshotPathTemplate) and both sets are
      # committed: `-darwin` for developer machines, `-linux` for this runner.
      # No update flag — a missing baseline should fail here rather than be
      # silently recorded, which is the difference between a gate and a rubber
      # stamp. Add a new one by running the suite locally and, for Linux,
      # taking it from the artifact below.
      - run: npm run test:visual
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Upload the recorded baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual/__screenshots__/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  report:
    name: Merge reports
    if: always()
    needs: [test, accessibility, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
